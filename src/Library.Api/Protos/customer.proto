syntax = "proto3";

option csharp_namespace = "Library.Api.Grpc";

package customer;

service CustomerGrpc {
  rpc GetCustomerDetails (CustomerRequest) returns (CustomerReply);
}

message CustomerRequest {
  string customer_id = 1;
}

message CustomerReply {
  string id = 1;
  string name = 2;
  string company_name = 3;
  bool found = 4;
}